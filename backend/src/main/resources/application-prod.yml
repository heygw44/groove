spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: redis
      port: 6379

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.groove: INFO
  file:
    name: /app/logs/groove.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

management:
  # metrics 는 8080 이 호스트 127.0.0.1 에만 바인딩되고(infra/docker-compose.prod.yml) Nginx 도
  # /api/ 만 프록시해(infra/nginx/groove.conf) 외부에 노출되지 않는다 — 메모리 압박 진단에 필요한
  # jvm.memory.used 등을 보려고 연다. Boot 3.5 는 exposure.include 만으로 개별 엔드포인트가
  # 켜진다(엔드포인트별 enabled 는 기본 true). 보안 설정도 /actuator/** 를 permitAll 로 열어둔다
  # (SecurityConfig).
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: never
  otlp:
    metrics:
      export:
        enabled: ${GROOVE_OTLP_METRICS_ENABLED:false}
        url: ${GROOVE_OTLP_METRICS_URL:}
        headers:
          "[Authorization]": ${GROOVE_OTLP_METRICS_AUTHORIZATION:}
        step: 60s
  metrics:
    tags:
      env: prod
      instance: ${HOSTNAME:unknown}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  cookie:
    secure: true

file:
  upload-path: ${FILE_UPLOAD_PATH}
  base-url: ${FILE_BASE_URL}
