spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/groove?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:groove}
    password: ${MYSQL_PASSWORD:groove1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 로컬 개발 편의. 운영은 validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    jdbc:
      # Flyway 미사용 프로파일이라 Boot 초기화기가 BATCH_* 를 만든다.
      initialize-schema: always

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-must-be-at-least-32-bytes-long}

toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_local_dev_only}

discogs:
  token: ${DISCOGS_TOKEN:discogs_token_local_dev_only}

logging:
  level:
    com.groove: DEBUG
    org.hibernate.SQL: DEBUG
