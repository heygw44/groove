spring:
  application:
    name: groove
  profiles:
    active: local
  jpa:
    properties:
      hibernate:
        type:
          # ERD 의 BOOLEAN 컬럼과 맞춘다. Hibernate 기본값은 MySQL 에서 BIT(1) 이라 DDL 이 달라진다.
          preferred_boolean_jdbc_type: TINYINT
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  data:
    redis:
      # Redis 장애 시 DB 폴백이 지연되지 않도록 기본 타임아웃보다 짧게 잡는다.
      timeout: 1s
      connect-timeout: 500ms
  task:
    scheduling:
      thread-name-prefix: groove-scheduler-
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  tomcat:
    max-swallow-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.groove

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}            # 환경변수 필수, 최소 256bit (32바이트 이상)
  access-token-expiry: 30m
  refresh-token-expiry: 14d

auth:
  cookie:
    secure: false   # 로컬 HTTP. 운영은 application-prod.yml 에서 true

toss:
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
