spring:
  application:
    name: groove
  flyway:
    # 운영에서만 켠다. local 은 ddl-auto: update, test 는 create-drop 으로 스키마를 만든다.
    enabled: false
  profiles:
    active: local
  jpa:
    properties:
      hibernate:
        # @EntityGraph 가 빠진 지연 연관이 목록 크기만큼 쿼리를 내는 걸 막는 안전망.
        # 로컬에만 있으면 결함이 개발 중에는 가려지고 운영에서만 드러나므로 전 프로파일 공통으로 둔다.
        default_batch_fetch_size: 100
        type:
          # ERD 의 BOOLEAN 컬럼과 맞춘다. Hibernate 기본값은 MySQL 에서 BIT(1) 이라 DDL 이 달라진다.
          preferred_boolean_jdbc_type: TINYINT
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  data:
    redis:
      # Redis 장애 시 DB 폴백이 지연되지 않도록 기본 타임아웃보다 짧게 잡는다.
      timeout: 1s
      connect-timeout: 500ms
  lifecycle:
    # Boot 3.4+ 기본값(30s)과 같다. 토스 connect 3s + read 10s 에 여유를 둔 값이라 compose
    # stop_grace_period 산정 근거로 삼기 위해 그대로 명시해 둔다.
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      thread-name-prefix: groove-scheduler-
      pool:
        size: 4
      shutdown:
        await-termination: true
        # 스케줄러 루프는 신호를 보고 진행 중인 건만 마저 끝내고 멈추므로 짧게 둔다.
        await-termination-period: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  http:
    client:
      # 토스 결제 API 호출용. 결제 승인이 걸려 있는 요청 스레드를 오래 잡지 않도록 짧게 둔다.
      connect-timeout: 3s
      read-timeout: 10s
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  # Boot 3.4+ 기본값(graceful)과 같지만, compose stop_grace_period 산정 근거라 명시해 둔다.
  # compose stop_grace_period 는 이 값(spring.lifecycle.timeout-per-shutdown-phase=30s)
  # + 스케줄러 대기(10s) + 비동기 실행기 대기(5s+5s) + 경보 실행기 대기(2s) 보다 커야 SIGKILL 로 안 잘린다.
  shutdown: graceful
  tomcat:
    max-swallow-size: 10MB
    # accept-count: 아직 accept 되지 않은 연결이 기다리는 커널 큐 길이(기본 100). 컨테이너
    # somaxconn(4096)·Nginx 동시 프록시 상한(4096)과 맞춰 러시 초반 SYN 재전송을 없앤다.
    # max-connections: accept 된 뒤 Tomcat 이 붙들고 있는 연결 수 상한(기본 8192, 여기선 명시만).
    # threads.max(기본 200)는 그중 동시에 처리하는 요청 수 — 백로그를 늘려도 처리 속도 자체는
    # 스레드·CPU 가 결정하므로 지연은 남고, 재전송 타이머(1·2·4·8초) 계단만 사라진다.
    accept-count: 4096
    max-connections: 8192

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.groove

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}            # 환경변수 필수, 최소 256bit (32바이트 이상)
  access-token-expiry: 30m
  refresh-token-expiry: 14d
  refresh-token-grace: 10s

auth:
  cookie:
    secure: false   # 로컬 HTTP. 운영은 application-prod.yml 에서 true

toss:
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY}   # 환경변수 필수. 로컬 기본값은 application-local.yml
  base-url: https://api.tosspayments.com

discogs:
  base-url: https://api.discogs.com
  token: ${DISCOGS_TOKEN}   # 환경변수 필수. 로컬 기본값은 application-local.yml
  user-agent: "GrooveLP/1.0 +https://groove-lp.duckdns.org"
  # 토스와 같은 전역 spring.http.client 값을 쓰지 않도록 분리한다.
  read-timeout: 5s
  retry:
    # 순간적 연결 끊김만 되받는다. 404/429 는 대상이 아니고, 배치 재시도(catalog.import.retry-limit)와 곱해진다.
    max-attempts: 2
    backoff: 300ms

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}

limited:
  # 부하 테스트에서 Redis ON/OFF 를 비교하기 위한 스위치. 운영에서는 항상 true 로 둔다.
  redis-enabled: ${LIMITED_REDIS_ENABLED:true}
  # 구매 진입점의 드롭 메타(상태/오픈·마감 시각) 캐시 TTL. 0 이하면 캐시를 끄고 매 요청마다 DB 를 읽는다.
  # 스케줄러 open/close 주기(10초)보다 훨씬 짧게 둬 지연 오픈/마감 체감을 줄인다.
  meta-cache-ttl: 3s

groove:
  payment:
    reconcile:
      interval: 60s
      grace: 2m
      batch-size: 50
      max-attempts: 10
    settlement:
      # 04:00 DB 백업(infra/scripts/backup.sh) 뒤에 돈다.
      cron: "0 10 5 * * *"
      overlap: 10m
      page-size: 5000
      max-pages: 20
  limited:
    reconcile:
      interval: 30s
      # reserve→write 커밋 최악 소요(드롭 행 락 대기 포함)보다 넉넉히 잡는다.
      grace: 30s
    circuit:
      # 일시적 타임아웃 한두 건으로 넘어가지 않게, 연속 실패 5회부터 OPEN 한다.
      failure-threshold: 5
      # Redis 재기동 등 일시 장애가 보통 이 안에 끝난다. 너무 짧으면 프로브가 계속 실패를 다시 센다.
      open-duration: 10s
      # Hikari 기본 풀 10 의 절반. 폴백 중에도 일반 요청이 커넥션을 못 잡는 상황을 막는다.
      fallback-permits: 5
      # 끄면 서킷 OPEN 중 즉시 LIMITED_BUSY 로 거절한다. 채택 여부는 측정 뒤 결정한다.
      fallback-enabled: true
  recommend:
    # 추천 상품 특성 캐시 TTL. 0 이하면 캐시를 끄고 매 요청마다 다시 읽는다.
    feature-cache-ttl: 60s
  alert:
    # 비어 있으면 로그만 남기는 LoggingAlertNotifier 가 주입된다(로컬·테스트).
    slack-webhook-url: ${GROOVE_ALERT_SLACK_WEBHOOK_URL:}
    # 같은 경보 키는 이 창 안에서 한 번만 보낸다. 폭주해도 채널이 도배되지 않게.
    suppress-window: 5m
    queue-capacity: 100
    timeout: 2s
    # 억제 창이 지나도록 안 나간 요약을 이 주기로 마저 보낸다.
    flush-interval: 60s
  catalog:
    freshness:
      # Discogs 약관의 6시간 규칙. 재검증이 밀리면 상세 응답에서 해당 필드를 가린다.
      ttl: 6h
      # 킬 스위치. false 면 전부 fresh 취급 — Discogs 장애 시 스펙 표가 통째로 사라지는 것을 막는다.
      enabled: true
    resync:
      interval: 5m
      max-calls-per-run: 150  # 5분 x 150 = 30 req/min = Discogs 60 req/min 버킷의 50%(나머지는 관리자 조회용 유보)
      sweep-cron: "0 15 2 * * *"
      view-window: 7d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  otlp:
    metrics:
      export:
        # url 기본값이 localhost 라 켜 두면 로컬·테스트에서도 전송 실패 로그가 쌓인다. 운영만 환경변수로 켠다.
        enabled: false
  metrics:
    enable:
      # 리포지토리 메서드·보안 필터·Redis 명령마다 시리즈가 생겨 무료 한도(1만 series)를 빨리 먹는다.
      spring.data: false
      spring.security: false
      lettuce: false
    distribution:
      percentiles:
        # 히스토그램 버킷은 시리즈가 커서 클라이언트 백분위만 쓴다(인스턴스 1대라 집계 문제 없음).
        http.server.requests: 0.95, 0.99
        hikaricp.connections.acquire: 0.95

catalog:
  import:
    chunk-size: 5
    skip-limit: 50
    retry-limit: 3
    backoff-initial: 2s
    backoff-max: 8s
