spring:
  application:
    name: groove
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.groove

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}            # 환경변수 필수, 최소 256bit (32바이트 이상)
  access-token-expire-minutes: 30
  refresh-token-expire-days: 14

toss:
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
