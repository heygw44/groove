services:
  mysql:
    image: mysql:8.0
    container_name: groove-mysql
    environment:
      MYSQL_DATABASE: groove
      MYSQL_USER: groove
      MYSQL_PASSWORD: groove1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # 호스트 3306은 다른 프로젝트가 쓸 수 있어 기본 3307
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: groove-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"   # 기본 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: groove-backend
    profiles: ["full"]   # 기본은 mysql/redis만 기동. 백엔드까지 컨테이너로 띄우려면: docker compose --profile full up
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-must-be-at-least-32-bytes-long}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  mysql-data:
