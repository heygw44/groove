services:
  mysql:
    image: mysql:8.0
    container_name: groove-mysql
    environment:
      MYSQL_DATABASE: groove
      MYSQL_USER: groove
      MYSQL_PASSWORD: groove1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: groove-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # 운영과 같은 정책(noeviction + AOF everysec, RDB 끔).
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction",
      "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-groove-backend}
    container_name: groove-backend
    profiles: ["full"]   # 기본은 mysql/redis만 기동. 백엔드까지 컨테이너로 띄우려면: docker compose --profile full up
    # Docker 기본 10초면 graceful 종료(웹 30s + 스케줄러 대기 10s + 비동기 실행기 5s+5s)가 SIGKILL 로 잘린다.
    stop_grace_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-must-be-at-least-32-bytes-long}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      # 측정 시 목 서버(infra/k6/toss-mock.mjs)로 돌리기 위함. 운영은 base-url 을 그대로 쓴다.
      TOSS_BASE_URL: ${TOSS_BASE_URL:-https://api.tosspayments.com}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FILE_UPLOAD_PATH: /app/uploads
      FILE_BASE_URL: http://localhost:8080/uploads
      LIMITED_REDIS_ENABLED: ${LIMITED_REDIS_ENABLED:-true}
      GROOVE_ALERT_SLACK_WEBHOOK_URL: ${GROOVE_ALERT_SLACK_WEBHOOK_URL:-}
      GROOVE_OTLP_METRICS_ENABLED: ${GROOVE_OTLP_METRICS_ENABLED:-false}
      GROOVE_OTLP_METRICS_URL: ${GROOVE_OTLP_METRICS_URL:-}
      GROOVE_OTLP_METRICS_AUTHORIZATION: ${GROOVE_OTLP_METRICS_AUTHORIZATION:-}
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_COM_GROOVE: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads

volumes:
  mysql-data:
  redis-data:
  uploads-data:
