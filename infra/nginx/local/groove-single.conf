# groove.conf 와 같되 upstream 에 backend-1 하나만 둔다. 1대+Nginx 기준선 측정용.
# 사용: NGINX_CONF=groove-single.conf docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile scale up -d
upstream groove_backend {
    server backend-1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Upstream $upstream_addr always;

    # 부하·카오스 러너의 사전 점검용. 운영 Nginx 는 노출하지 않는다.
    location = /actuator/health {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
