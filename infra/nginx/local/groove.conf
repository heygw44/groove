# 운영 infra/nginx/groove.conf 에서 SSL·certbot·정적 파일 서빙·HTTP→HTTPS 리다이렉트를 뺀 로컬 scale용.
# 앱 2인스턴스(backend-1/backend-2) 앞에 두고 어느 인스턴스가 응답했는지 X-Upstream 으로 알려준다.
upstream groove_backend {
    server backend-1:8080;
    server backend-2:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Upstream $upstream_addr always;

    # 한정반 구매 경로에 limit_req 를 두지 않는다: 앱에 이미 1인 1회 제약과 서킷 폴백(503 LIMITED_BUSY)이 있고,
    # Nginx 가 내는 HTML 오류 응답은 프론트가 해석하지 못하며, 부하 측정 기준선을 오염시킨다.
    # 부하·카오스 러너의 사전 점검용. 운영 Nginx 는 노출하지 않는다.
    location = /actuator/health {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
