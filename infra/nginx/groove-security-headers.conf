# groove 보안 헤더. nginx 1.24 는 location 에 add_header 가 하나라도 있으면 server 레벨 add_header 를 전부 상속하지 않는다.
# 그래서 별도 파일로 두고 server 블록과 add_header 를 쓰는 모든 location 이 include 한다.
# 서버 경로: /etc/nginx/snippets/groove-security-headers.conf (infra/scripts/deploy-nginx.sh 가 배포한다).

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# duckdns 하위 도메인이라 includeSubDomains·preload 는 걸지 않는다.
# 쓰지 않는 기능만 막는다. payment 는 Toss 결제창이 쓸 수 있어 건드리지 않는다.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Toss 위젯 도메인은 SDK 가 런타임에 정해 와일드카드로 둔다. Report-Only 기간에 주요 화면과 카드·토스페이 결제에서 위반 0건을 확인했다.
# 결제가 막히면 헤더 이름만 Content-Security-Policy-Report-Only 로 되돌려 배포한다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.tosspayments.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.tosspayments.com; frame-src https://*.tosspayments.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
