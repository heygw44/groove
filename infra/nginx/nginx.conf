# 출처: 운영 서버 /etc/nginx/nginx.conf (nginx/1.24.0 Ubuntu 24.04 패키지 기본값) 원본.
# 바꾼 값 3개: worker_rlimit_nofile 8192, events.worker_connections 4096(기본 768), multi_accept on.
# 슬롯 계산: 프록시 요청 1건 = 클라이언트+업스트림 2슬롯 → worker 2 × 4096 / 2 ≈ 동시 4096 요청.

user www-data;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 4096;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	# Toss 웹훅 전용 rate limit. 한정반 구매 경로에는 쓰지 않는다(위 limit_req 기각 결정, groove.conf 참고).
	limit_req_zone $binary_remote_addr zone=toss_webhook:1m rate=5r/s;

	# 로그인·회원가입 IP 단위 rate limit. 계정 단위 잠금은 앱(LoginAttemptGuard)이 한다.
	# 허용 목록은 서버에만 둔다(공개 저장소에 IP 를 남기지 않는다). 부하 측정 때 infra/k6/ratelimit-allow.sh 가 채우고 비운다.
	# geo 안의 include 는 파일이 없으면 nginx -t 가 실패하므로 deploy-nginx.sh 가 빈 파일을 만들어 둔다.
	geo $auth_limit_exempt {
		default 0;
		include /etc/nginx/groove-ratelimit-allow.conf;
	}
	# 키가 빈 문자열이면 limit_req 가 세지 않는다.
	map $auth_limit_exempt $auth_limit_key {
		0 $binary_remote_addr;
		1 "";
	}
	limit_req_zone $auth_limit_key zone=auth:1m rate=10r/m;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


