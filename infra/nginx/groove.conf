upstream groove_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    server_name groove-lp.duckdns.org;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 보안 헤더(add_header)는 스니펫 한 곳에서 관리한다. add_header 를 쓰는 location 도 같은 스니펫을 include 해야 한다.
    include /etc/nginx/snippets/groove-security-headers.conf;
    # 보안 헤더는 위 스니펫으로만 붙인다. Spring Security 기본값과 겹치지 않게 업스트림 값을 숨긴다.
    # location 의 proxy_set_header 가 있어도 이 값은 상속된다(1.24 에서 세 프록시 location 모두 확인).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    # 프록시 location 은 X-Forwarded-For 를 $proxy_add_x_forwarded_for 로 넘긴다. 앞쪽 값은 요청자가 쓸 수 있어
    # 앱(ClientIpResolver)은 이 Nginx 가 덧붙인 마지막 값만 믿는다. 앞단에 프록시 홉을 추가하면 앱도 바꿔야 한다.

    root /var/www/groove;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 배포 직후 다음 이동에서 새 빌드를 받도록 매번 재검증한다(ETag·Last-Modified 로 바뀌지 않았으면 304).
    # SPA 폴백과 / 의 index 내부 리다이렉트가 모두 여기로 온다.
    # add_header 를 쓰므로 nginx 1.24 상속 규칙 때문에 보안 헤더 스니펫을 다시 include 한다.
    location = /index.html {
        include /etc/nginx/snippets/groove-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 빌드 산출물은 파일명에 콘텐츠 해시가 있어 1년 immutable 로 둔다.
    # 없는 옛 청크에 index.html 을 돌려주면 HTML 이 그 URL 로 1년 캐시되므로 404 로 끝낸다.
    # 보안 헤더 스니펫 include 는 위와 같은 이유(nginx 1.24 상속)로 반복한다.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/groove-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 한정반 구매 경로에 limit_req 를 두지 않는다: 앱에 이미 1인 1회 제약과 서킷 폴백(503 LIMITED_BUSY)이 있고,
    # Nginx 가 내는 HTML 오류 응답은 프론트가 해석하지 못하며, 부하 측정 기준선을 오염시킨다.
    # 웹훅 경로만 예외(브라우저·프론트·부하 측정과 무관). 로그인·회원가입도 예외인데, 429 를 ApiResponse 모양 JSON 으로
    # 돌려주고 부하 측정 IP 는 허용 목록으로 뺀다.

    # 출처: https://docs.tosspayments.com/reference/using-api/security (토스 웹훅 발신 IP 10개)
    # 토스는 웹훅에 서명·커스텀 헤더를 싣지 않아 발신 IP로 검증한다.
    # IP 목록이 바뀌면 403 → 토스가 최대 7회 재전송하다 유실되지만, 폴링 대사가 메운다.
    location = /api/v1/payments/webhook {
        allow 13.124.18.147;
        allow 13.124.108.35;
        allow 3.36.173.151;
        allow 3.38.81.32;
        allow 115.92.221.121;
        allow 115.92.221.122;
        allow 115.92.221.123;
        allow 115.92.221.125;
        allow 115.92.221.126;
        allow 115.92.221.127;
        deny all;

        limit_req zone=toss_webhook burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 무차별 대입 방어. reissue 는 멀티 탭 부팅이 한꺼번에 부르므로 제외한다.
    location ~ ^/api/v1/auth/(login|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limited;

        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @auth_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"AUTH_RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}}';
    }

    # 쿠폰 코드 대입 방어. 앱의 회원 단위 잠금과 별개로 IP 단위로 막는다.
    location = /api/v1/coupons/issue {
        limit_req zone=coupon_issue burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @coupon_rate_limited;

        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @coupon_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"COUPON_ISSUE_RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}}';
    }

    location /api/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        alias /opt/groove/uploads/;
        # 여기서 add_header 를 쓰면 server 레벨 보안 헤더가 전부 상속되지 않는다(nginx 1.24). 캐시는 expires 로 충분하다.
        expires 7d;
    }

    listen 443 ssl backlog=2048; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/groove-lp.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/groove-lp.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = groove-lp.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name groove-lp.duckdns.org;
    return 404; # managed by Certbot


}