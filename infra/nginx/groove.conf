upstream groove_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    server_name groove-lp.duckdns.org;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # duckdns 하위 도메인이라 includeSubDomains·preload 는 걸지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Toss 위젯 도메인은 SDK 가 런타임에 정해 와일드카드로 둔다. Report-Only 기간에 주요 화면과 카드·토스페이 결제에서 위반 0건을 확인했다.
    # 결제가 막히면 헤더 이름만 Content-Security-Policy-Report-Only 로 되돌려 배포한다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.tosspayments.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.tosspayments.com; frame-src https://*.tosspayments.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # 보안 헤더는 위 add_header 로만 붙인다. Spring Security 기본값과 겹치지 않게 업스트림 값을 숨긴다.
    # location 의 proxy_set_header 가 있어도 이 값은 상속된다(1.24 에서 세 프록시 location 모두 확인).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    root /var/www/groove;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 한정반 구매 경로에 limit_req 를 두지 않는다: 앱에 이미 1인 1회 제약과 서킷 폴백(503 LIMITED_BUSY)이 있고,
    # Nginx 가 내는 HTML 오류 응답은 프론트가 해석하지 못하며, 부하 측정 기준선을 오염시킨다.
    # 웹훅 경로만 예외(브라우저·프론트·부하 측정과 무관). 로그인·회원가입도 예외인데, 429 를 ApiResponse 모양 JSON 으로
    # 돌려주고 부하 측정 IP 는 허용 목록으로 뺀다.

    # 출처: https://docs.tosspayments.com/reference/using-api/security (토스 웹훅 발신 IP 10개)
    # 토스는 웹훅에 서명·커스텀 헤더를 싣지 않아 발신 IP로 검증한다.
    # IP 목록이 바뀌면 403 → 토스가 최대 7회 재전송하다 유실되지만, 폴링 대사가 메운다.
    location = /api/v1/payments/webhook {
        allow 13.124.18.147;
        allow 13.124.108.35;
        allow 3.36.173.151;
        allow 3.38.81.32;
        allow 115.92.221.121;
        allow 115.92.221.122;
        allow 115.92.221.123;
        allow 115.92.221.125;
        allow 115.92.221.126;
        allow 115.92.221.127;
        deny all;

        limit_req zone=toss_webhook burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 무차별 대입 방어. reissue 는 멀티 탭 부팅이 한꺼번에 부르므로 제외한다.
    location ~ ^/api/v1/auth/(login|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limited;

        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @auth_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"AUTH_RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}}';
    }

    location /api/ {
        proxy_pass http://groove_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        alias /opt/groove/uploads/;
        # 여기서 add_header 를 쓰면 server 레벨 보안 헤더가 전부 상속되지 않는다(nginx 1.24). 캐시는 expires 로 충분하다.
        expires 7d;
    }

    listen 443 ssl backlog=2048; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/groove-lp.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/groove-lp.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = groove-lp.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name groove-lp.duckdns.org;
    return 404; # managed by Certbot


}