name: "기능 개발"
description: "새 기능이나 작업 단위"
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        하나의 PR 로 닫힐 크기로 자른다.
  - type: textarea
    id: background
    attributes:
      label: "배경"
      description: "왜 필요한가"
      placeholder: "예) 회원이 JWT로 로그인하고 만료 시 재발급 받을 수 있어야 한다."
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "작업 내용"
      description: "구현할 항목을 체크리스트로 작성한다."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건"
      description: "동작·테스트 기준으로 작성한다."
      placeholder: |
        - Swagger에서 API 호출 시 200 응답
        - 서비스 단위 테스트 통과
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "영역"
      options:
        - backend
        - frontend
        - infra
        - backend + frontend
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: "참고"
      description: "관련 문서, 디자인, 레퍼런스 링크"
    validations:
      required: false
