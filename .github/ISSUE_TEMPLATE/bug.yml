name: "버그"
description: "동작이 기대와 다른 경우 등록한다."
title: "[fix] "
labels: ["fix"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: "증상"
      description: "무엇이 잘못 동작하는가"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "재현 방법"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대 동작"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "실제 동작"
      description: "에러 메시지, 로그, 스크린샷을 첨부한다."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "영역"
      options:
        - backend
        - frontend
        - infra
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "환경"
      placeholder: "예) 브라우저/OS/커밋"
    validations:
      required: false
