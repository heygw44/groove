# 워크플로 액션은 커밋 SHA 로 고정한다. 고정한 SHA 와 버전 주석은 Dependabot PR 로만 올린다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - chore
      - infra
    commit-message:
      prefix: chore(infra)
    # 액션 갱신을 PR 하나로 묶어 리뷰와 CI 를 한 번에 끝낸다.
    groups:
      github-actions:
        patterns:
          - "*"
