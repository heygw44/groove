# 앱 2인스턴스 + Nginx upstream 로컬 스택. docker-compose.yml 위에 겹쳐 쓴다.
# 실행: docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile scale up -d --build
# 기본 backend(profile full)는 scale 프로필에서 뜨지 않는다.
x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-groove-backend}
  profiles: ["scale"]
  stop_grace_period: 60s
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 120s
  environment:
    SPRING_PROFILES_ACTIVE: local
    MYSQL_HOST: mysql
    REDIS_HOST: redis
    JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-must-be-at-least-32-bytes-long}
    TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    TOSS_BASE_URL: ${TOSS_BASE_URL:-https://api.tosspayments.com}
    DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
    # 클라이언트는 Nginx 를 거쳐 들어오므로 CORS 허용 출처/파일 URL 도 Nginx 포트 기준이어야 한다.
    CORS_ALLOWED_ORIGINS: http://localhost:${NGINX_PORT:-8080}
    FILE_UPLOAD_PATH: /app/uploads
    FILE_BASE_URL: http://localhost:${NGINX_PORT:-8080}/uploads
    LIMITED_REDIS_ENABLED: ${LIMITED_REDIS_ENABLED:-true}
    SPRING_JPA_SHOW_SQL: "false"
    LOGGING_LEVEL_COM_GROOVE: INFO
    LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
  volumes:
    - uploads-data:/app/uploads

services:
  backend-1:
    <<: *backend-common
    build:
      context: ./backend
    container_name: groove-backend-1

  backend-2:
    <<: *backend-common
    container_name: groove-backend-2

  nginx:
    image: nginx:1.27-alpine
    container_name: groove-nginx
    profiles: ["scale"]
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/local/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/local/${NGINX_CONF:-groove.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
